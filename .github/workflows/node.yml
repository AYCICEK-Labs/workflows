name: Node

# Node version from .nvmrc, a clean install, then lint, test and build when the scripts exist.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present
